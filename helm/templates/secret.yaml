{{- if and (not .Values.pgbench.connection.existingSecret) .Values.pgbench.connection.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgbench-metric-server.fullname" . }}
  labels:
    {{- include "pgbench-metric-server.labels" . | nindent 4 }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ .Values.pgbench.connection.passwordKey }}: {{ .Values.pgbench.connection.password | quote }}
{{- end }}
